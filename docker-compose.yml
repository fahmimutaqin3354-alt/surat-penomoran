services:
  # ----------------------------------------------------------------------------
  # Laravel PHP-FPM Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surat_penomoran_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-surat_penomoran}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_SERVER_URL=http://wa-server:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Nginx Web Server Service
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: surat_penomoran_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: surat_penomoran_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-surat_penomoran}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Node.js WhatsApp Baileys Server Service
  # ----------------------------------------------------------------------------
  wa-server:
    build:
      context: ./wa-baileys-server
      dockerfile: Dockerfile
    container_name: surat_penomoran_wa
    restart: unless-stopped
    ports:
      - "${WA_PORT:-3000}:3000"
    volumes:
      - wa_auth_data:/app/auth_info
      - ./storage:/var/www/html/storage:ro
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: surat_penomoran_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # phpMyAdmin Web UI for Database Management
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: surat_penomoran_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - surat_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  wa_auth_data:
    driver: local

networks:
  surat_network:
    driver: bridge
